services:
  migu-m3u:
    build: .
    container_name: migu-m3u
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      # 跳转版订阅地址（/migu.m3u）会按 MIGU_BASE_URL 生成频道跳转链接。
      # 注意：不要填死成局域网 IP，否则用公网域名导入 /migu.m3u 后频道地址仍是内网 IP，无法播放。
      # 留空则自动按播放器请求的域名生成（推荐，局域网/公网都可用）。
      # - MIGU_BASE_URL=http://192.168.1.100:8090
      # 免登录最高可用画质：3=高清720P；如需 H265 原画可设 true
      - MIGU_RATE_TYPE=3
      - MIGU_H265=false
      # 频道分组，按需增删
      - MIGU_CATEGORIES=央视,卫视,地方,新闻,影视,教育,综艺,少儿,纪实
      # 播放地址缓存与刷新频率（分钟）
      - MIGU_URL_CACHE_MINUTES=180
      - MIGU_REFRESH_MINUTES=60
      # 节目单（EPG）：往前/往后各拉几天，用于回看与频道节目信息
      # - MIGU_EPG_BACK_DAYS=2
      # - MIGU_EPG_FORWARD_DAYS=1
      # - MIGU_EPG_REFRESH_HOURS=6
    volumes:
      # 频道列表与扫码登录信息持久化（重启不丢失）
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
